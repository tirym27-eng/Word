<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>LexiRise — слова</title><style>body{margin:0;background:#08090c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}*{box-sizing:border-box}button,input{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;padding:20px 18px 90px}.screen{display:none}.screen.active{display:block;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:800}.logo span{color:#a78bfa}.icon{background:#111218;color:white;border:1px solid #292b35;border-radius:13px;width:42px;height:42px}.eyebrow{color:#a78bfa;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.8px}h1{font-size:32px;line-height:1.05;letter-spacing:-1.2px}h2{margin:8px 0}p,.note,small{color:#9295a3}.card{background:#101116;border:1px solid #292b35;border-radius:22px}.hero{padding:22px;margin-top:18px}.progress{height:7px;background:#252630;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#9677ff;width:0;transition:.5s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{padding:14px;background:#111218;border:1px solid #292b35;border-radius:16px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#9295a3}.primary{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#8d6cff,#6948ef);color:white;font-weight:800}.levels{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.levels button,.secondary{padding:9px 13px;border-radius:12px;background:#171820;border:1px solid #292b35;color:#9295a3}.levels button.active{color:white;border-color:#765fc0;background:#211b31}.top{display:flex;gap:10px;align-items:center;margin:18px 0}.back{background:n лова — без грамматики и лишнего.</p><div class="card hero"><div class="eyebrow" id="lvl">A1</div><h2 id="title">Начинаем с основы</h2><div class="progress"><i id="bar"></i></div><div class="note" id="txt">0 изучено</div><div class="stats"><div class="stat"><b id="mastered">0</b><span>выучено</span></div><div class="stat"><b id="streak">0</b><span>серия</span></div><div class="stat"><b id="accuracy">—</b><span>точность</span></div></div><button class="primary" id="start">Начать тренировку</button></div><div class="levels" id="levels"></div></section><section id="learn" class="screen"><div class="top"><button class="back" id="back">‹ Назад</button><div class="session"><i id="sbar"></i></div><span class="note" id="scount"></span></div><div class="card wordcard"><div class="badge" id="badge"></div><div class="word" id="word"></div><div class="translation" id="trans"></div><div class="note" id="hint"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="primary" id="next" style="display:none;margin-top:10px">Следующее слово</button></section><section id="library" class="screen"><div class="eyebrow">Словарь</div><h1>Все слова</h1><input class="search" id="search" placeholder="Поиск English или русский…"><div class="levels" id="liblevels"></div><div class="list" id="list"></div></section><section id="progress" class="screen"><div class="eyebrow">Результат</div><h1>Твой прогресс</h1><p>Каждое слово закрепляется пятью правильными ответами.</p><div class="stats"><div class="stat"><b id="pm">0</b><span>выучено</span></div><div class="stat"><b id="pt">0</b><span>в базе</span></div><div class="stat"><b id="pa">—</b><span>точность</span></div></div><div class="card hero" id="lstats"></div></section></div><nav><button class="active" data-s="home">⌂<br><small>Главная</small></button><button data-s="library">Aa<br><small>Слова</small></button><button data-s="progress">↗<br><small>Прогресс</small></button></nav><script>

const L=['A1','A2','B1','B2','C1','C2'],T={A1:'Начинаем с основы',A2:'Расширяем словарный запас',B1:'Уверенный уровень',B2:'Продвинутые слова',C1:'Высокий уровень',C2:'Мастерство'};let S=JSON.parse(localStorage.getItem('lexirise_words')||'null')||{level:'A1',m:{},correct:0,total:0,streak:0,day:''},session=[],si=0,lib='ALL';const save=()=>localStorage.setItem('lexirise_words',JSON.stringify(S)),m=i=>S.m[i]||0,pool=l=>W.map((w,i)=>({w,i})).filter(x=>x.w[0]===l),mc=l=>pool(l).filter(x=>m(x.i)>=5).length,show=id=>{document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));render()};
function render(){let l=S.level,a=pool(l);lvl.textContent=l;title.textContent=T[l];bar.style.width=(a.length?mc(l)/a.length*100:0)+'%';txt.textContent=mc(l)+' из '+a.length+' изучено';mastered.textContent=W.filter((_,i)=>m(i)>=5).length;streak.textContent=S.streak;accuracy.textContent=S.total?Math.round(S.correct/S.total*100)+'%':'—';levels.innerHTML=L.map(x=>`<button class="${x===S.level?'active':''}" onclick="S.level='${x}';save();render()">${x}</button>`).join('');pm.textContent=W.filter((_,i)=>m(i)>=5).length;pt.textContent=W.length;pa.textContent=S.total?Math.round(S.correct/S.total*100)+'%':'—';lstats.innerHTML=L.map(x=>`<div style="margin:16px 0"><b>${x}</b><span style="float:right;color:#9295a3">${mc(x)}/${pool(x).length}</span><div class="progress" style="margin-top:7px"><i style="width:${pool(x).length?mc(x)/pool(x).length*100:0}%"></i></div></div>`).join('');renderLib()}
function renderLib(){if(!document.getElementById('list'))return;liblevels.innerHTML=['ALL',...L].map(x=>`<button class="${lib===x?'active':''}" onclick="lib='${x}';renderLib()">${x==='ALL'?'Все':x}</button>`).join('');let q=search.value.toLowerCase();let a=W.map((w,i)=>({w,i})).filter(x=>(lib==='ALL'||x.w[0]===lib)&&(!q||x.w[1].toLowerCase().includes(q)||x.w[2].toLowerCase().includes(q))).slice(0,400);list.innerHTML=a.map(x=>`<div class="row"><div><b>${x.w[1]}</b><br><small>${x.w[2]} · ${x.w[0]}</small></div><div><small>${m(x.i)}/5</small><div class="meter"><i style="width:${m(x.i)*20}%"></i></div></div></div>`).join('')||'<div class="note">Ничего не найдено</div>'}

function question(){let x=session[si];badge.textContent=x.w[0]+' · '+m(x.i)+'/5';word.textContent=x.w[1];trans.textContent=x.w[2];hint.textContent='Выбери перевод';feedback.textContent='';next.style.display='none';scount.textContent=(si+1)+'/'+session.length;sbar.style.width=(si/session.length*100)+'%';let opts=[x,...pool(x.w[0]).filter(y=>y.i!==x.i).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);answers.innerHTML=opts.map(o=>`<button class="answer" data-i="${o.i}">${o.w[2]}</button>`).join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b,Number(b.dataset.i)===x.i,x))}
